<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up - mmfms</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create account</h1>
      <p class="sub">Each account gets its own separate, private file storage.</p>
      <form id="signupForm">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
        <div class="small">3-32 characters: letters, numbers, _ or -</div>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" required>
        <div class="small">At least 6 characters</div>
        <button class="btn-primary full" type="submit">Sign up</button>
        <div id="msg" class="msg"></div>
      </form>
      <div class="switch">Already have an account? <a href="/login.html">Log in</a></div>
    </div>
  </div>
  <script src="/js/signup.js"></script>
</body>
</html>
